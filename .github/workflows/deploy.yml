name: Build and deploy Netflix Clone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_db_migrations:
        description: "Run the database SQL files against RDS (only when safe/idempotent)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  TF_DIR: infra/terraform
  DOCKERHUB_USERNAME: Aubakerzzz

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Assumes these folders each contain a Dockerfile. The DB image is used
      # for schema/migration tasks only; production PostgreSQL runs on RDS.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            aubakerzzz/netflix-clone-frontend:${{ github.sha }}
            aubakerzzz/netflix-clone-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./back
          push: true
          tags: |
            aubakerzzz/netflix-clone-backend:${{ github.sha }}
            aubakerzzz/netflix-clone-backend:latest

      - name: Build and push database utility image
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: |
            aubakerzzz/netflix-clone-db:${{ github.sha }}
            aubakerzzz/netflix-clone-db:latest

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Bootstrap a remote Terraform state bucket without requiring the AWS console.
      - name: Prepare encrypted Terraform state bucket
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="netflix-clone-tfstate-${ACCOUNT_ID}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi
          aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$BUCKET" --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format Terraform files
        run: terraform fmt -recursive "$TF_DIR"

      - name: Terraform init
        run: terraform -chdir="$TF_DIR" init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=netflix-clone/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform plan
        run: terraform -chdir="$TF_DIR" plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve tfplan

      - name: Run database initialization scripts (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_db_migrations
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER=$(terraform -chdir="$TF_DIR" output -raw ecs_cluster_name)
          TASK_DEF=$(terraform -chdir="$TF_DIR" output -raw migration_task_definition_arn)
          SUBNETS=$(terraform -chdir="$TF_DIR" output -json public_subnet_ids | jq -c .)
          SG=$(terraform -chdir="$TF_DIR" output -raw backend_security_group_id)
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=$SUBNETS,securityGroups=[$SG],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ECS migration task did not start"
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN"
            echo "Database initialization failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Force ECS services to deploy current image tags
        shell: bash
        run: |
          set -euo pipefail
          CLUSTER=$(terraform -chdir="$TF_DIR" output -raw ecs_cluster_name)
          FRONT_SERVICE=$(terraform -chdir="$TF_DIR" output -raw frontend_service_name)
          BACK_SERVICE=$(terraform -chdir="$TF_DIR" output -raw backend_service_name)
          aws ecs update-service --cluster "$CLUSTER" --service "$FRONT_SERVICE" --force-new-deployment >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service "$BACK_SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$FRONT_SERVICE" "$BACK_SERVICE"

      - name: Show application URL
        run: terraform -chdir="$TF_DIR" output application_url
